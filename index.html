<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasbih Counter</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">

</head>


<body>


    <div class="container">


        <div class="islamic-header">

            <div class="moon">
                ☾
            </div>


            <h1>
                بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
            </h1>


            <p>
                Digital Tasbih Counter • Version 2 🚀
            </p>


        </div>



        <div class="tasbih-box">


            <div class="beads" id="beads">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <h2 id="count">
                0
            </h2>


            <p>
                سبحان الله
            </p>


        </div>




        <button onclick="increment()">
            ✨ Count
        </button>


        <button onclick="resetCounter()" class="reset">
            Reset
        </button>




        <div class="target">

            <h3>
                Target: 99
            </h3>


            <p id="message">
                May Allah accept your Dhikr 🤍
            </p>


        </div>



    </div>



    <script src="script.js"></script>


</body>

</html>
