apiVersion: apps/v1

kind: Deployment

metadata:
  name: tasbih-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tasbih

  template:
    metadata:
      labels:
        app: tasbih

    spec:
      containers:
        - name: tasbih-container

          image: ayeshairam/tasbih-counter:v2

          env:
            - name: TARGET_COUNT

              valueFrom:
                configMapKeyRef:
                  name: tasbih-config

                  key: TARGET_COUNT

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"

              cpu: "100m"

            limits:
              memory: "128Mi"

              cpu: "200m"

          livenessProbe:
            httpGet:
              path: /

              port: 80

            initialDelaySeconds: 10

            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /

              port: 80

            initialDelaySeconds: 5

            periodSeconds: 10
