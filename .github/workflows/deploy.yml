name: Automated Docker Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME123 }}
          password: ${{ secrets.DOCKERHUB_TOKEN123 }}

      - name: Build Docker image
        run: docker build -t ayeshairam/tasbih-counter:latest .

      - name: Push Docker image
        run: docker push ayeshairam/tasbih-counter:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ayeshairam/tasbih-counter:latest
            docker stop tasbih-counter || true
            docker rm tasbih-counter || true
            docker run -d --name tasbih-counter -p 8080:80 ayeshairam/tasbih-counter:latest
